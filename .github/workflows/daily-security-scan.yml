name: Daily Security Scan

on:
  schedule:
    # 07:00 UTC = 08:00 WAT (West Africa Time)
    - cron: '0 7 * * *'
  workflow_dispatch: # allow manual runs

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run pnpm audit
        id: audit
        run: |
          echo "## pnpm audit report" >> $GITHUB_STEP_SUMMARY
          pnpm audit --json > audit.json || true
          pnpm audit --prod || true
          # Also produce human-readable summary
          pnpm audit 2>&1 | tee audit.txt || true
          cat audit.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: |
            audit.json
            audit.txt
          retention-days: 30

      - name: Create or update security issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Daily Security Scan Report\n\n';
            body += `**Date:** ${new Date().toISOString()}\n`;
            body += `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;

            try {
              if (fs.existsSync('audit.txt')) {
                const audit = fs.readFileSync('audit.txt', 'utf8');
                body += '### pnpm audit output\n```\n' + audit.slice(0, 60000) + '\n```\n';
              } else {
                body += '_No audit.txt produced._\n';
              }
            } catch (e) {
              body += `Error reading audit: ${e.message}\n`;
            }

            body += '\n---\n*This issue is automatically updated by the Daily Security Scan workflow. Review Dependabot alerts at: Settings → Security → Dependabot.*\n';

            const title = '🔒 Daily Security Scan Report';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-scan',
              per_page: 5
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-scan']
              });
              console.log('Created new security-scan issue');
            }
